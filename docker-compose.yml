services:
  # ==========================================
  # Qdrant Vector Database (Ephemeral RAG Collections)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: deepsearch-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO

  # ==========================================
  # Langfuse Database (PostgreSQL)
  # ==========================================
  langfuse-db:
    image: postgres:16-alpine
    container_name: deepsearch-langfuse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - ./data/langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Langfuse LLMOps & Tracing Server
  # ==========================================
  langfuse-server:
    image: langfuse/langfuse:3
    container_name: deepsearch-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=deepsearch-local-secret-key-must-be-min-32-chars-long
      - SALT=deepsearch-salt-local-key
      - TELEMETRY_ENABLED=false
