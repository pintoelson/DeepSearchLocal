[project]
name = "deepsearch-local"
version = "0.1.0"
description = "Autonomous Deep Research Agent Platform optimized for local execution on consumer GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeepSearch-Local Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.20",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "duckduckgo-search>=6.2.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.1",
    "openai>=1.45.0",
    "sse-starlette>=2.1.0",
    "fastembed>=0.4.0",
]

[dependency-groups]
finetuning = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.34.0",
    "datasets>=2.21.0",
    "gguf>=0.19.0",
]
eval = [
    "ragas>=0.1.15",
    "trulens-eval>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server", "rag", "api", "finetuning", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
